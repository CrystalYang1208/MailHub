openapi: 3.1.1
info:
  title: MailHub 本地桥接API设计合同
  version: 1.0.0-design
  description: 设计草案；127.0.0.1动态端口、同源、全中文错误。除bootstrap/登录前用户接口外，进程令牌和用户会话必须同时验证。不是现有原型API实现。
servers:
- url: http://127.0.0.1:{port}/api/v1
  variables:
    port:
      default: '49152'
      description: 实际启动动态端口；不是固定生产端口
security:
- BridgeToken: []
  UserSession: []
paths:
  /bridge/bootstrap:
    post:
      operationId: bootstrapBridge
      tags:
      - Security
      summary: 一次性启动引导码换进程令牌
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes:
      - BOOTSTRAP_EXPIRED
      - BOOTSTRAP_REPLAY
      responses:
        '200':
          description: 一次性启动引导码换进程令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/BridgeAccess'
                  error:
                    type: 'null'
                  requestId: &id001
                    type: string
                    format: uuid
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeBootstrap'
  /users:
    get:
      operationId: listUsers
      tags:
      - Settings
      summary: 列出最多四个本地用户名称，不返回密钥/账号
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes: []
      responses:
        '200':
          description: 列出最多四个本地用户名称，不返回密钥/账号
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - BridgeToken: []
    post:
      operationId: registerUser
      tags:
      - Settings
      summary: 注册本地用户并初始化密钥与用户库
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes:
      - USER_LIMIT
      - NAME_EXISTS
      responses:
        '201':
          description: 注册本地用户并初始化密钥与用户库
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - BridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /sessions:
    post:
      operationId: login
      tags:
      - Security
      summary: 密码认证并解封主密钥
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes:
      - LOGIN_INVALID
      - LOGIN_COOLDOWN
      - KEY_UNAVAILABLE
      responses:
        '200':
          description: 密码认证并解封主密钥
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Session'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      security:
      - BridgeToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /sessions/current:
    get:
      operationId: getCurrentSession
      tags:
      - Security
      summary: 当前用户信息
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/User'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    delete:
      operationId: logout
      tags:
      - Security
      summary: 撤销会话、取消任务并清密钥
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes: []
      responses:
        '200':
          description: 撤销会话、取消任务并清密钥
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Ack'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /sessions/switch:
    post:
      operationId: switchUser
      tags:
      - Security
      summary: 先退出旧身份再验证目标密码；失败保持锁定
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes:
      - LOGIN_INVALID
      - LOGIN_COOLDOWN
      responses:
        '200':
          description: 先退出旧身份再验证目标密码；失败保持锁定
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Session'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /users/current/password:
    put:
      operationId: changePassword
      tags:
      - Security
      summary: 原子更换验证值和密钥封套并注销全部会话
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes:
      - PASSWORD_INVALID
      - KEY_UNAVAILABLE
      responses:
        '200':
          description: 原子更换验证值和密钥封套并注销全部会话
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Ack'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
  /users/current:
    delete:
      operationId: deleteUser
      tags:
      - Settings
      summary: 本人再次密码确认后清本地数据，非远程删信
      x-requirements:
      - FR-F01
      x-priority: Must
      x-error-codes:
      - LOGIN_INVALID
      responses:
        '202':
          description: 本人再次密码确认后清本地数据，非远程删信
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Operation'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
  /providers:
    get:
      operationId: listProviders
      tags:
      - Account
      summary: 模板与三步中文授权指引
      x-requirements:
      - FR-A01
      - FR-A02
      - FR-A03
      - FR-A04
      x-priority: Must
      x-error-codes: []
      responses:
        '200':
          description: 模板与三步中文授权指引
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Provider'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /settings/oauth-client:
    put:
      operationId: importOAuthClient
      tags:
      - Account
      summary: 导入本用户Google桌面客户端配置
      x-requirements:
      - FR-A03
      x-priority: Must
      x-error-codes:
      - OAUTH_CLIENT_INVALID
      responses:
        '200':
          description: 导入本用户Google桌面客户端配置
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Ack'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientImport'
  /oauth/flows:
    post:
      operationId: startOAuth
      tags:
      - Account
      summary: 创建桌面PKCE授权流程
      x-requirements:
      - FR-A03
      - FR-A07
      x-priority: Must
      x-error-codes:
      - OAUTH_CLIENT_MISSING
      responses:
        '201':
          description: 创建桌面PKCE授权流程
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/OAuthFlow'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthStart'
  /oauth/flows/{flowId}:
    get:
      operationId: getOAuthFlow
      tags:
      - Account
      summary: 查询授权状态，不返回邮箱令牌
      x-requirements:
      - FR-A03
      - FR-A07
      x-priority: Must
      x-error-codes:
      - OAUTH_FLOW_EXPIRED
      responses:
        '200':
          description: 查询授权状态，不返回邮箱令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/OAuthFlow'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      parameters:
      - name: flowId
        in: path
        required: true
        schema: *id001
        description: 仅当前用户归属资源
  /accounts/validations:
    post:
      operationId: validateAccount
      tags:
      - Account
      summary: 校验配置、授权及文件夹，返回短期绑定验证结果
      x-requirements:
      - FR-A01
      - FR-A02
      - FR-A03
      - FR-A04
      - FR-A05
      - FR-A06
      x-priority: Must
      x-error-codes:
      - AUTH_FAILED
      - IMAP_DISABLED
      - SERVER_CONFIG
      - NETWORK_UNREACHABLE
      - AUTH_COOLDOWN
      - TLS_FAILED
      - PROVIDER_REJECTED
      responses:
        '200':
          description: 校验配置、授权及文件夹，返回短期绑定验证结果
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/AccountValidation'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountValidationRequest'
  /accounts:
    post:
      operationId: addAccount
      tags:
      - Account
      summary: 消费验证结果并原子保存账号密文
      x-requirements:
      - FR-A01
      - FR-A06
      x-priority: Must
      x-error-codes:
      - ACCOUNT_EXISTS
      - VALIDATION_EXPIRED
      responses:
        '201':
          description: 消费验证结果并原子保存账号密文
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    $ref: '#/components/schemas/Account'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountCreate'
    get:
      operationId: listAccounts
      tags:
      - Account
      summary: 本用户账号列表
      x-requirements:
      - FR-A02
      - FR-C02
      x-priority: Must
      x-error-codes: []
      responses:
        '200':
          description: 本用户账号列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Account'
                  error:
                    type: 'null'
                  requestId: *id001
                required:
                - ok
                - data
                - error
                - requestId
                additionalProperties: false
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags:
      - Account
      summary: 账号详情，绝不返回凭据
      x-requirements:
      - FR-A06
      x-priority: Must
      x-error-codes: []
      responses:
        '200':
          description: 账号详情，绝不返回凭据
          content:
            application/json:
              schema:
