          - paused
          - auth-required
          - completed
          - failed
          - canceled
        attempt: *id015
        nextRunAt: *id003
        progressDone: *id015
        progressTotal:
          type:
          - integer
          - 'null'
          minimum: 0
        lastErrorCode:
          type:
          - string
          - 'null'
      required:
      - jobId
      - kind
      - state
      - attempt
      - nextRunAt
      - progressDone
      - progressTotal
      - lastErrorCode
      additionalProperties: false
    Operation:
      type: object
      properties:
        operationId: *id001
        state:
          type: string
          enum:
          - pending
          - running
          - done
          - failed
        lastErrorCode:
          type:
          - string
          - 'null'
      required:
      - operationId
      - state
      additionalProperties: false
    SyncRequest:
      type: object
      properties:
        accountId: *id001
        folderId: *id001
      required: []
      additionalProperties: false
      description: 无accountId为当前用户全部启用账号；folderId必须属于accountId；清数据暂停后手动调用恢复自动补拉。
    SyncAccepted:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        coalesced: *id002
      required:
      - jobs
      - coalesced
      additionalProperties: false
    ReadMutation:
      type: object
      properties:
        isRead: *id002
      required:
      - isRead
      additionalProperties: false
    DownloadRequest:
      type: object
      properties:
        attachmentIds:
          type: array
          items: *id001
          minItems: 1
          maxItems: 100
      required:
      - attachmentIds
      additionalProperties: false
    DownloadBatch:
      type: object
      properties:
        batchId: *id001
        state:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - canceled
        receivedBytes:
          type: integer
          minimum: 0
          maximum: 200000000
        items:
          type: array
          items:
            type: object
            properties:
              attachmentId: *id001
              state:
                type: string
              errorCode:
                type:
                - string
                - 'null'
            required:
            - attachmentId
            - state
            additionalProperties: false
      required:
      - batchId
      - state
      - receivedBytes
      - items
      additionalProperties: false
    Settings:
      type: object
      properties:
        syncIntervalMinutes:
          type: integer
          minimum: 5
          maximum: 60
        autoSyncPaused: *id002
        cacheLimitBytes:
          type: integer
          minimum: 1
        cacheUsedBytes: *id015
        indexBytes:
          type: integer
          minimum: 0
          description: SearchDocument UTF8逻辑载荷字节数，不冒充FTS物理大小或总盘占用
        attachmentBytes: *id015
        hasGoogleOAuthClient: *id002
        databaseBytes: *id015
        walBytes: *id015
      required:
      - syncIntervalMinutes
      - autoSyncPaused
      - cacheLimitBytes
      - cacheUsedBytes
      - indexBytes
      - attachmentBytes
      - hasGoogleOAuthClient
      - databaseBytes
      - walBytes
      additionalProperties: false
    SettingsUpdate:
      type: object
      properties:
        syncIntervalMinutes:
          type: integer
          minimum: 5
          maximum: 60
        cacheLimitBytes:
          type: integer
          minimum: 1
      required: []
      additionalProperties: false
      minProperties: 1
    Coverage:
      type: object
      properties:
        totalMessages: *id015
        bodyIndexed: *id015
        bodyPending: *id015
        bodyUnavailable: *id015
        complete: *id002
      required:
      - totalMessages
      - bodyIndexed
      - bodyPending
      - bodyUnavailable
      - complete
      additionalProperties: false
    Ack:
      type: object
      properties:
        done: *id002
      required:
      - done
      additionalProperties: false
    ErrorInfo:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
          description: 中文明确原因
        action:
          type: string
          description: 中文下一步操作
        retryAfterSeconds: *id015
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
            required:
            - field
            - code
            additionalProperties: false
      required:
      - code
      - message
      - action
      additionalProperties: false
    ErrorEnvelope:
      type: object
      properties:
        ok:
          const: false
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/ErrorInfo'
        requestId: *id001
      required:
      - ok
      - data
      - error
      - requestId
      additionalProperties: false
  responses:
    Error:
      description: 统一错误；无资源归属统一404；校验失败422；会话失效401；Origin/Host拒绝403。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
