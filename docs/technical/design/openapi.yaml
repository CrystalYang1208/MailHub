components:
  securitySchemes:
    BridgeToken:
      type: http
      scheme: bearer
      description: 进程级随机访问令牌，仅内存
    UserSession:
      type: apiKey
      in: header
      name: X-MailHub-Session
      description: 用户密码认证后签发，服务端绑定身份，切换后失效
  schemas:
    Address:
      type: object
      properties:
        name:
          type: string
          maxLength: 256
        address:
          type: string
          format: email
          maxLength: 320
      required:
      - address
      additionalProperties: false
    User:
      type: object
      properties:
        userId: *id001
        displayName:
          type: string
        state:
          type: string
          enum:
          - provisioning
          - active
          - deleting
      required:
      - userId
      - displayName
      - state
      additionalProperties: false
    Session:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        sessionToken:
          type: string
          writeOnly: false
          description: 一次返回，仅浏览器内存；不写日志
        expiresAt: *id003
        authVersion: &id010
          type: integer
          minimum: 1
      required:
      - user
      - sessionToken
      - expiresAt
      - authVersion
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
      required:
      - displayName
      - password
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        userId: *id001
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
      required:
      - userId
      - password
      additionalProperties: false
    PasswordChange:
      type: object
      properties:
        currentPassword:
          type: string
          writeOnly: true
          minLength: 1
        newPassword:
          type: string
          writeOnly: true
          minLength: 10
          maxLength: 128
      required:
      - currentPassword
      - newPassword
      additionalProperties: false
    BridgeBootstrap:
      type: object
      properties:
        code:
          type: string
          minLength: 32
          writeOnly: true
      required:
      - code
      additionalProperties: false
    BridgeAccess:
      type: object
      properties:
        bridgeToken:
          type: string
        expiresAt: *id003
      required:
      - bridgeToken
      - expiresAt
      additionalProperties: false
    ServerConfig:
      type: object
      properties:
        host:
          type: string
          minLength: 1
          maxLength: 253
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          type: string
          enum:
          - tls
          - starttls
      required:
      - host
      - port
      - security
      additionalProperties: false
    CredentialInput:
      type: object
      properties:
        type:
          type: string
          enum:
          - oauth2
          - authorization-code
          - app-password
          - password
        secret:
          type: string
          writeOnly: true
          maxLength: 4096
        oauthFlowId: *id001
      required:
      - type
      additionalProperties: false
      description: oauth2必须oauthFlowId，其他方式必须secret；互斥；服务端校验，永不回显。
      oneOf:
      - properties:
          type:
            const: oauth2
        required:
        - oauthFlowId
        not:
          required:
          - secret
      - properties:
          type:
            enum:
            - authorization-code
            - app-password
            - password
        required:
        - secret
        not:
          required:
          - oauthFlowId
    AccountValidationRequest:
